<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTI Promo 2028 · Álbum de recuerdos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@600;800&family=Pacifico&family=Space+Grotesk:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0f0c29;--bg2:#302b63;--ink:#f4f1ff;--mut:#b9b2e0;--ac:#ff7ac6;--ac2:#7af0ff;--card:rgba(255,255,255,.08);--r:16px;--cols:220px;--ov:.35;--f:'Poppins',system-ui,sans-serif;--fh:'Playfair Display',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f0c29;--bg2:#302b63;--ink:#f4f1ff}}
:root[data-theme="dark"]{--ink:#f4f1ff}
:root[data-theme="light"]{--card:rgba(255,255,255,.7)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg1)}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0}
#bg::after{content:"";position:absolute;inset:0;background:var(--bg1);opacity:var(--ov)}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
main,nav,footer{position:relative;z-index:2}
header{text-align:center;padding:56px 18px 20px}
.em{font-size:2.4rem}
h1{font-family:var(--fh);font-size:clamp(2.2rem,8vw,4.6rem);margin:.1em 0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;outline:none;line-height:1.1}
.sub{color:var(--mut);font-size:1.1rem;outline:none;margin:0 0 16px}
[contenteditable]:focus{outline:2px dashed var(--ac);outline-offset:4px;border-radius:6px}
[contenteditable]:empty::before{content:attr(data-ph);opacity:.5}
.b{font:600 .9rem var(--f);border:1px solid rgba(255,255,255,.25);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:99px;cursor:pointer;backdrop-filter:blur(8px);transition:.2s}
.b:hover{background:var(--ac);color:#111;transform:translateY(-2px)}
.stat{display:inline-block;margin:0 8px;color:var(--mut);font-size:.9rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 14px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg1) 55%,transparent)}
nav a{color:var(--ink);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:99px;background:var(--card)}
nav a:hover{background:var(--ac2);color:#111}
.yr{max-width:1200px;margin:34px auto;padding:0 18px}
.yh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#111;font-weight:700;padding:4px 14px;border-radius:99px;font-size:.9rem;min-width:3ch}
h2{font-family:var(--fh);font-size:clamp(1.5rem,4vw,2.3rem);margin:0;flex:1;outline:none}
.d{color:var(--mut);margin:6px 0 16px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cols),1fr));gap:20px}
.ph{position:relative;background:var(--card);border-radius:var(--r);overflow:hidden;transition:.3s}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}
.ph:hover{transform:translateY(-4px) rotate(0)!important;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.cap{width:100%;border:0;background:transparent;color:inherit;font:600 1.15rem 'Caveat',cursive;text-align:center;padding:8px 6px;outline:none}
.cap::placeholder{color:inherit;opacity:.4}
.polaroid .ph{background:#fff;color:#222;padding:10px 10px 4px;border-radius:4px;transform:rotate(var(--rot));box-shadow:0 6px 18px rgba(0,0,0,.3)}
.polaroid .ph img{aspect-ratio:1;border-radius:2px}
.glass .ph{backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25)}
.clean .ph{background:transparent}
.del{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;opacity:0;transition:.2s}
.ph:hover .del{opacity:1}
@media (hover:none){.del{opacity:1}}
.add{display:flex;align-items:center;justify-content:center;text-align:center;min-height:150px;border:2px dashed var(--ac);border-radius:var(--r);color:var(--ac);font-weight:600;cursor:pointer;transition:.2s;padding:14px}
.add:hover,.drag .add{background:var(--card);transform:scale(1.03)}
.drag{outline:2px dashed var(--ac2);outline-offset:8px;border-radius:12px}
footer{text-align:center;color:var(--mut);padding:40px 18px 60px;font-size:.9rem}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);z-index:40;background:color-mix(in srgb,var(--bg1) 92%,transparent);backdrop-filter:blur(18px);padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px;overflow-y:auto;transform:translateX(105%);transition:.35s;border-left:1px solid rgba(255,255,255,.15)}
#panel.open{transform:none}
#panel h3{margin:0 0 12px;font-family:var(--fh)}
#panel label{display:block;font-size:.8rem;color:var(--mut);margin:14px 0 5px}
#panel select,#panel input[type=range]{width:100%}
#panel select{padding:8px;border-radius:8px;background:var(--bg1);color:var(--ink);border:1px solid rgba(255,255,255,.2)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink);transform:scale(1.12)}
input[type=color]{width:100%;height:36px;border:0;border-radius:8px;background:none;padding:0}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:76vh;border-radius:8px;object-fit:contain}
#lb p{color:#fff;font:600 1.4rem 'Caveat',cursive;margin:0;text-align:center}
#lb button{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:0;font-size:1.6rem;width:46px;height:46px;border-radius:50%;cursor:pointer}
#lb .x{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px}#lb .p{left:10px}#lb .n{right:10px}
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--bg1),var(--bg2))}
#gate.off{display:none}
.gc{width:min(380px,100%);background:var(--card);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);border-radius:22px;padding:30px 24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.gc h2{font-family:var(--fh);margin:6px 0 4px;font-size:1.8rem;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gc p{color:var(--mut);margin:0 0 18px;font-size:.95rem}
.gc input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;outline:none}
.gc input:focus{border-color:var(--ac)}
.gc .b{width:100%;margin-top:4px}
.gc .main{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#111;border:0}
.gc hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:16px 0}
#err{color:#ff8a8a;font-size:.85rem;min-height:1.2em;margin:2px 0}
.ro .add,.ro .del,.ro #open,.ro #addy,.ro [data-dy],.ro #panel{display:none!important}
.add{position:relative;user-select:none}
.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.vw{position:relative}
.ph video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer;background:#000}
.polaroid .ph video{aspect-ratio:1;border-radius:2px}
.pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);cursor:pointer}
</style>
</head>
<body>
<div id="bg"></div><canvas id="fx"></canvas>
<main>
<header>
 <div class="em">🎓</div>
 <h1 id="h1" contenteditable data-ph="Título"></h1>
 <p class="sub" id="sub" contenteditable data-ph="Subtítulo"></p>
 <div><span class="stat" id="cnt"></span></div><br>
 <button class="b" id="open">🎨 Personalizar</button>
 <button class="b" id="addy">＋ Agregar año</button>
 <button class="b" id="out">🚪 Salir</button>
</header>
<nav id="nav"></nav>
<div id="yrs"></div>
</main>
<footer>Hecho con 💜 por la promo BTI 2028 · Tocá cualquier texto para editarlo</footer>

<aside id="panel">
 <div class="row" style="justify-content:space-between;align-items:center"><h3>🎨 Personalizar</h3><button class="b" id="close">✕</button></div>
 <label>Tema</label><div class="row" id="themes"></div>
 <label>Color principal</label><input type="color" id="ac">
 <label>Color secundario</label><input type="color" id="ac2">
 <label>Fuente del texto</label><select id="font"></select>
 <label>Fuente de los títulos</label><select id="fh"></select>
 <label>Estilo de fotos</label>
 <select id="style"><option value="polaroid">Polaroid</option><option value="glass">Cristal</option><option value="clean">Limpio</option></select>
 <label>Tamaño de fotos</label><input type="range" id="size" min="140" max="360">
 <label>Redondeo de esquinas</label><input type="range" id="radius" min="0" max="32">
 <label>Oscurecer fondo (con imagen)</label><input type="range" id="ov" min="0" max="90">
 <label>Partículas flotantes</label>
 <select id="fx2"><option value="">Ninguna</option><option>✦</option><option>♥</option><option>●</option><option>❄</option><option>★</option><option>🎓</option></select>
 <label>Imagen de fondo</label>
 <div class="row"><label class="b" style="margin:0;display:inline-block">Subir<input type="file" id="bgf" accept="image/*" hidden></label><button class="b" id="bgx">Quitar</button></div>
 <label>Todo</label><button class="b" id="rst">Restablecer diseño</button>
</aside>

<div id="lb"><button class="x" id="lx">✕</button><button class="p" id="lp">‹</button><img id="li" alt=""><video id="lv" controls playsinline style="display:none;max-width:94vw;max-height:76vh;border-radius:8px;background:#000"></video><p id="lc"></p><button class="n" id="ln">›</button></div>

<div id="gate"><form class="gc" id="gf" autocomplete="off"><div style="font-size:2.4rem">🎓</div><h2>BTI · Promo 2028</h2><p>Ingresá para ver el álbum de recuerdos</p>
<input id="gu" placeholder="Usuario" autocomplete="username"><input id="gp" type="password" placeholder="Contraseña" autocomplete="current-password"><div id="err"></div>
<button class="b main" type="submit">🔑 Entrar como administrador</button><hr><button class="b" type="button" id="gs">👀 Entrar como espectador</button></form></div>
<script>
const $=s=>document.querySelector(s),K='bti28';
const TH={
aurora:['#0f0c29','#302b63','#f4f1ff','#b9b2e0','#ff7ac6','#7af0ff','rgba(255,255,255,.08)'],
atardecer:['#2b0f2e','#c2410c','#fff4e8','#fdc9a0','#ffb347','#ff5e7e','rgba(255,255,255,.1)'],
océano:['#021b33','#0b6e8a','#eaf9ff','#9fd6e6','#5ef2d6','#4da3ff','rgba(255,255,255,.1)'],
bosque:['#0b2a1c','#2f6b3f','#effaf0','#a9d6b1','#b7f27a','#ffd166','rgba(255,255,255,.1)'],
sakura:['#ffe3ec','#e5d4ff','#3b1f3a','#7a5a78','#e8478b','#8a5cf6','rgba(255,255,255,.7)',1],
claro:['#f6f7fb','#dfe6f5','#1b2240','#58608a','#4f46e5','#0ea5e9','rgba(255,255,255,.8)',1]};
const FN=['Poppins','Space Grotesk','Playfair Display','Pacifico','Caveat'];
const DEF={title:'BTI · Promo 2028',sub:'Nuestro álbum de recuerdos',theme:'aurora',ac:'',ac2:'',font:'Poppins',fh:'Playfair Display',style:'polaroid',size:220,radius:16,ov:35,ch:'✦',bg:0,
years:[{id:'y1',tag:'2026',name:'Primer año',desc:'Donde todo empezó ✨'},{id:'y2',tag:'2027',name:'Segundo año',desc:'Escribí acá lo que quieras recordar'},{id:'y3',tag:'2028',name:'Tercer año',desc:'La recta final 🎓'}]};
let S=JSON.parse(JSON.stringify(DEF)),db,mem=[],AC='#ff7ac6',lb={l:[],i:0};
try{const s=JSON.parse(localStorage.getItem(K));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* IndexedDB */
const init=()=>new Promise(r=>{try{const q=indexedDB.open(K,1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>{db=q.result;try{const g=db.transaction('p').objectStore('p').getAll();g.onsuccess=()=>{mem=g.result||[];r()};g.onerror=()=>r()}catch(e){r()}};q.onerror=()=>r()}catch(e){r()}});
const put=p=>{const i=mem.findIndex(x=>x.id==p.id);i<0?mem.push(p):mem[i]=p;if(db)try{db.transaction('p','readwrite').objectStore('p').put(p)}catch(e){}};
const del=id=>{mem=mem.filter(x=>x.id!=id);if(db)try{db.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}};
const P=()=>mem.filter(p=>p.year!='_bg').sort((a,b)=>a.t-b.t);
const shrink=(f,m)=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.82))};i.onerror=()=>r(null);i.src=u});
const VU={},vurl=p=>VU[p.id]||(VU[p.id]=URL.createObjectURL(p.vid));
const media=p=>p.vid?`<div class="vw" data-o="${p.id}"><video src="${vurl(p)}#t=0.1" preload="metadata" muted playsinline data-o="${p.id}"></video><span class="pl" data-o="${p.id}">▶</span></div>`:`<img src="${p.src}" data-o="${p.id}" alt="">`;
async function upload(y,files){let n=0;for(const f of files){const id='p'+Date.now()+Math.random().toString(36).slice(2,6),t=Date.now()+(n++);
const ty=f.type||(/\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name)?'video/mp4':'image/jpeg');
if(ty.startsWith('video/')){if(f.size>314572800){alert('El video "'+f.name+'" pesa más de 300 MB');continue}put({id,year:y,cap:'',vid:f,t})}
else if(ty.startsWith('image/')){const src=await shrink(f,1400);if(src)put({id,year:y,cap:'',src,t})}}render()}
/* Apply design */
function apply(){const t=TH[S.theme]||TH.aurora,s=document.documentElement.style;
[['--bg1',t[0]],['--bg2',t[1]],['--ink',t[2]],['--mut',t[3]],['--ac',S.ac||t[4]],['--ac2',S.ac2||t[5]],['--card',t[6]],['--r',S.radius+'px'],['--cols',S.size+'px'],['--ov',S.ov/100],['--f',`'${S.font}',system-ui,sans-serif`],['--fh',`'${S.fh}',Georgia,serif`]].forEach(a=>s.setProperty(a[0],a[1]));
document.documentElement.dataset.theme=t[7]?'light':'dark';AC=S.ac||t[4];
const b=mem.find(p=>p.id=='bg');$('#bg').style.backgroundImage=b?`url(${b.src})`:'none';
document.body.className=S.style;$('#ac').value=AC;$('#ac2').value=S.ac2||t[5];
['font','fh','style','fx2'].forEach(k=>$('#'+k).value=S[k==='fx2'?'ch':k]);['size','radius','ov'].forEach(k=>$('#'+k).value=S[k]);
document.querySelectorAll('.sw').forEach(e=>e.classList.toggle('on',e.dataset.t==S.theme))}
/* Render */
function render(){
$('#h1').textContent=S.title;$('#sub').textContent=S.sub;
const ps=P();$('#cnt').textContent=`📷 ${ps.length} recuerdos · 📅 ${S.years.length} años`;
$('#nav').innerHTML=S.years.map(y=>`<a href="#${y.id}">${esc(y.tag)} · ${esc(y.name)}</a>`).join('');
$('#yrs').innerHTML=S.years.map(y=>{const l=ps.filter(p=>p.year==y.id);
return `<section class="yr" id="${y.id}"><div class="yh"><span class="tag" contenteditable data-y="${y.id}" data-f="tag">${esc(y.tag)}</span><h2 contenteditable data-y="${y.id}" data-f="name" data-ph="Nombre">${esc(y.name)}</h2><button class="b" data-dy="${y.id}">🗑 Año</button></div>
<p class="d" contenteditable data-y="${y.id}" data-f="desc" data-ph="Escribí una descripción…">${esc(y.desc)}</p>
<div class="grid" data-g="${y.id}">${l.map((p,i)=>`<figure class="ph" style="margin:0;--rot:${((i*37)%7-3)*.8}deg">${media(p)}<input class="cap" data-c="${p.id}" value="${esc(p.cap)}" placeholder="Escribí un recuerdo…"><button class="del" data-x="${p.id}" title="Eliminar">✕</button></figure>`).join('')}
<div class="add" data-pick="${y.id}">＋ Agregar fotos y videos<br>tocá para abrir la galería<input type="file" accept="image/*,video/*" multiple class="fi" data-up="${y.id}"></div></div></section>`}).join('')}
/* Events */
document.addEventListener('focusout',e=>{const t=e.target;
if(t.id=='h1'||t.id=='sub'){S[t.id=='h1'?'title':'sub']=t.textContent.trim();save();return}
if(t.dataset&&t.dataset.y){const y=S.years.find(a=>a.id==t.dataset.y);y[t.dataset.f]=t.textContent.trim();save();$('#nav').innerHTML=S.years.map(y=>`<a href="#${y.id}">${esc(y.tag)} · ${esc(y.name)}</a>`).join('')}});
document.addEventListener('input',e=>{const c=e.target.dataset&&e.target.dataset.c;if(c){const p=mem.find(x=>x.id==c);p.cap=e.target.value;put(p)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.up){const fl=[...t.files];t.value='';upload(t.dataset.up,fl)}});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-pick]');if(a&&e.target.tagName!='INPUT'&&role=='admin')a.querySelector('input').click()});
document.addEventListener('click',e=>{const t=e.target,d=t.dataset;
if(d.x){del(d.x);render()}
else if(d.dy){if(confirm('¿Eliminar este año y todas sus fotos?')){mem.filter(p=>p.year==d.dy).forEach(p=>del(p.id));S.years=S.years.filter(y=>y.id!=d.dy);save();render()}}
else if(d.o){const y=t.closest('[data-g]').dataset.g;lb.l=P().filter(p=>p.year==y);lb.i=lb.l.findIndex(p=>p.id==d.o);show()}
else if(d.t){S.theme=d.t;S.ac=S.ac2='';save();apply()}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const g=e.target.closest&&e.target.closest('[data-g]');if(!g)return;e.preventDefault();g.classList.toggle('drag',ev=='dragover');if(ev=='drop'){g.classList.remove('drag');upload(g.dataset.g,[...e.dataTransfer.files])}}));
$('#addy').onclick=()=>{S.years.push({id:'y'+Date.now(),tag:String(new Date().getFullYear()),name:'Nuevo año',desc:''});save();render();location.hash=S.years[S.years.length-1].id};
$('#open').onclick=()=>$('#panel').classList.add('open');$('#close').onclick=()=>$('#panel').classList.remove('open');
/* Panel */
$('#themes').innerHTML=Object.keys(TH).map(k=>`<div class="sw" data-t="${k}" title="${k}" style="background:linear-gradient(135deg,${TH[k][0]},${TH[k][4]})"></div>`).join('');
['font','fh'].forEach(k=>$('#'+k).innerHTML=FN.map(f=>`<option>${f}</option>`).join(''));
const bind=(id,k,fn)=>$('#'+id).addEventListener('input',e=>{S[k]=fn?fn(e.target.value):e.target.value;save();apply()});
bind('ac','ac');bind('ac2','ac2');bind('font','font');bind('fh','fh');bind('style','style');bind('size','size',Number);bind('radius','radius',Number);bind('ov','ov',Number);bind('fx2','ch');
$('#bgf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const src=await shrink(f,1920);if(src){put({id:'bg',year:'_bg',src,t:0});apply()}};
$('#bgx').onclick=()=>{del('bg');apply()};
$('#rst').onclick=()=>{if(confirm('¿Restablecer colores, fuentes y estilo? Las fotos y textos se mantienen.')){const k=S.years,t=S.title,s=S.sub;S=JSON.parse(JSON.stringify(DEF));S.years=k;S.title=t;S.sub=s;save();apply()}};
/* Lightbox */
function show(){const p=lb.l[lb.i];if(!p)return;const v=$('#lv'),i=$('#li');v.pause();if(p.vid){i.style.display='none';v.style.display='block';v.src=vurl(p)}else{v.style.display='none';v.removeAttribute('src');i.style.display='block';i.src=p.src}$('#lc').textContent=p.cap||'';$('#lb').classList.add('on')}
const step=d=>{lb.i=(lb.i+d+lb.l.length)%lb.l.length;show()};
$('#lx').onclick=()=>{$('#lv').pause();$('#lb').classList.remove('on')};$('#lp').onclick=()=>step(-1);$('#ln').onclick=()=>step(1);
addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key=='Escape')$('#lx').click();if(e.key=='ArrowLeft')step(-1);if(e.key=='ArrowRight')step(1)});
/* Partículas */
const cv=$('#fx'),cx=cv.getContext('2d');let ps=[];
const sz=()=>{cv.width=innerWidth;cv.height=innerHeight};addEventListener('resize',sz);sz();
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
if(S.ch){if(!ps.length)for(let i=0;i<36;i++)ps.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:10+Math.random()*18,v:.25+Math.random()*.6,a:Math.random()*6});
cx.fillStyle=AC;cx.globalAlpha=.3;ps.forEach(p=>{p.y-=p.v;p.a+=.012;p.x+=Math.sin(p.a)*.5;if(p.y<-30){p.y=cv.height+30;p.x=Math.random()*cv.width}cx.font=p.s+'px serif';cx.fillText(S.ch,p.x,p.y)})}else ps=[];
requestAnimationFrame(loop)})();
/* Acceso */
let role='';const HASH='c9b814c07bfdaba602c169126ee2d1ccb20d4c7f8db46a047f375c04108e77a5';
const h53=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const H2='h5160435579797953';
const sha=async t=>{if(!(window.crypto&&crypto.subtle))return 'h'+h53(t);return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('')};
function lock(){const ro=role!='admin';document.body.classList.toggle('ro',ro);document.querySelectorAll('[contenteditable]').forEach(e=>e.contentEditable=!ro);document.querySelectorAll('.cap').forEach(e=>e.readOnly=ro)}
const _r=render;render=function(){_r();lock()};
const _u=upload;upload=async function(y,f){if(role=='admin')return _u(y,f)};
function enter(r){role=r;try{sessionStorage.setItem(K+'r',r)}catch(e){}$('#gate').classList.add('off');$('#out').textContent='🚪 Salir ('+(r=='admin'?'Admin':'Espectador')+')';$('#panel').classList.remove('open');lock()}
$('#gf').onsubmit=async e=>{e.preventDefault();let ok=false;try{const r=await sha($('#gu').value.trim().toLowerCase()+':'+$('#gp').value);ok=r==HASH||r==H2}catch(x){}
if(ok){$('#err').textContent='';$('#gp').value='';enter('admin')}else $('#err').textContent='Usuario o contraseña incorrectos'};
$('#gs').onclick=()=>enter('viewer');
$('#out').onclick=()=>{role='';try{sessionStorage.removeItem(K+'r')}catch(e){}$('#gu').value=$('#gp').value='';$('#gate').classList.remove('off');$('#lv').pause();$('#lb').classList.remove('on')};
function gate(){let r='';try{r=sessionStorage.getItem(K+'r')||''}catch(e){}if(r=='admin'||r=='viewer')enter(r);else lock()}
init().then(()=>{apply();render();gate()});
</script>
</body>
